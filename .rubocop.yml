---
plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - bin/*

Gemspec/RequireMFA:
  Enabled: false

#########
# STYLE #
#########

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

##########
# LAYOUT #
##########

Layout/EmptyLines:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundModuleBody:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

#########
# RSPEC #
#########

RSpec/NotToNot:
  EnforcedStyle: to_not

# spec/support holds real Thor applications, not examples: printing their
# completion script on stdout is the behaviour under test.
RSpec/Output:
  Exclude:
    - spec/support/**/*

# The generation specs are split by concern (zsh options, zsh enums, bash
# scripts), not one file per class, so their path cannot match the class they
# describe.
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/fylla/**/*

# Golden-output examples embed whole completion scripts as heredocs.
RSpec/ExampleLength:
  Exclude:
    - spec/**/*

RSpec/MultipleExpectations:
  Exclude:
    - spec/**/*

###########
# METRICS #
###########

Metrics/MethodLength:
  Exclude:
    - spec/**/*
